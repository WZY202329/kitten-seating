<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F0F5F9">
  <meta name="description" content="把小小的凌乱，整理成刚刚好。100关猫咪排序小游戏，免费撤回和提示，进度保存在本机。">
  <title>喵屋排排坐 · 100间小屋</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #dfe8ef; color: #344c60; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    main { width: min(100vw, 430px, calc(100dvh * .55)); height: 100dvh; max-height: 930px; background: #f0f5f9; position: relative; overflow: hidden; box-shadow: 0 15px 80px #385d7c20; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .accessible { position: fixed; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .accessible:focus-within { left: 10px; bottom: 10px; width: min(90vw, 400px); height: auto; padding: 12px; z-index: 10; background: #fff; border: 2px solid #537d9f; border-radius: 12px; }
    .accessible button { margin: 4px; padding: 10px; background: #dfeaf3; color: #344c60; border: 1px solid #aac1d4; border-radius: 8px; }
    @media (min-width: 600px) { main { height: min(94dvh, 930px); border: 1px solid #bfd0de; border-radius: 28px; } }
  </style>
</head>
<body>
  <main aria-label="喵屋排排坐小游戏">
    <canvas id="game" aria-label="猫咪排序棋盘。使用下方辅助按钮也可以操作。"></canvas>
    <div class="accessible"><p id="game-status" role="status" aria-live="polite"></p><nav id="game-controls" aria-label="游戏操作"></nav></div>
  </main>
  <noscript>请启用 JavaScript 后试玩喵屋排排坐。</noscript>
  <script src="./browser.js"></script>
</body>
</html>
